version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage-data:/var/www/html/storage

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - storage-data:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  apache:
    image: httpd:2.4-alpine
    depends_on:
      - app
    ports:
      - "8081:80"
    profiles: ["apache"]
    volumes:
      - ./:/var/www/html:ro
      - storage-data:/var/www/html/storage:ro
      - ./apache.httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --queue=webhooks,notifications,tenant,default --verbose --tries=3 --timeout=120
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage-data:/var/www/html/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage-data:/var/www/html/storage

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: school_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: school
      MYSQL_PASSWORD: school
    ports:
      - "33060:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"

volumes:
  mysql-data:
  storage-data:
