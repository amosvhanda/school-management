# Apache virtual host for the School ERP (PHP-FPM).
# Use with docker-compose profile `apache` or any Apache + php-fpm stack.
#
# Expected document root: /var/www/html/public
# Expected PHP-FPM socket/proxy: app:9000 (Docker) or unix:/run/php/php-fpm.sock

<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        FallbackResource /index.php
    </Directory>

    # Proxy PHP to the FPM container/service.
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    ProxyTimeout 120
    LimitRequestBody 26214400

    ErrorLog ${APACHE_LOG_DIR}/school-erp-error.log
    CustomLog ${APACHE_LOG_DIR}/school-erp-access.log combined
</VirtualHost>
